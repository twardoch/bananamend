# this_file: Cargo.toml
[workspace]
resolver = "2"
members = ["crates/bananamendr", "crates/bananamendr-py"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/twardoch/bananamend"
homepage = "https://github.com/twardoch/bananamend"
authors = ["Adam Twardoch <adam+github@twardoch.com>"]

[workspace.dependencies]
bananamendr = { path = "crates/bananamendr", version = "=1.0.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[profile.release]
lto = "thin"
codegen-units = 1
